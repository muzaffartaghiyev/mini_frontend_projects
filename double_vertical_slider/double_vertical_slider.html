<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../main_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Double Vertical Slider</title>
</head>
<body>
    <a class="to_main_page" href="../index.html">To Main Page</a>


    <div class="slider-container">
        <div class="left-slide">
            <div style="background-color: #fd3555;">
                <h1>Nature flower</h1>
                <p>all in pink</p>
            </div>
            <div style="background-color: #2a86ba;">
                <h1>Bluuuue sky</h1>
                <p>with it's mountains</p>
            </div>
            <div style="background-color: #252e33;">
                <h1>Lonely Castle</h1>
                <p>in the wilderness</p>
            </div>
            <div style="background-color: #ffb866;">
                <h1>Flying Eagle</h1>
                <p>in the sunset</p>
            </div>
            
        </div>
        <div class="right-slide">
            <div style="background-image: url(https://cdn.pixabay.com/photo/2016/10/19/13/42/eagle-1753002_1280.jpg);"></div>
            <div style="background-image: url(https://cdn.pixabay.com/photo/2018/01/21/01/46/architecture-3095716_1280.jpg);"></div>
            <div style="background-image: url(https://cdn.pixabay.com/photo/2022/11/29/11/30/lake-7624330_1280.jpg);"></div>
            <div style="background-image: url(https://cdn.pixabay.com/photo/2016/10/06/14/07/sunflowers-1719119_1280.jpg);"></div>
        </div>

        <di class="action-buttons">
            <button class="down-button">
                <i class="fas fa-arrow-down"></i>
            </button>
            <button class="up-button">
                <i class="fas fa-arrow-up"></i>
            </button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
